  name: Verify live API

  # Run manually from the Actions tab.
  # WARNING: This workflow RESETS live data, then restores the demo slots.

  on:
    workflow_dispatch:
      inputs:
        confirm:
          description: "Type RESET to confirm this wipes live bookings"
          required: true
          type: string

  jobs:
    verify:
      if: ${{ github.event.inputs.confirm == 'RESET' }}
      runs-on: ubuntu-latest
      timeout-minutes: 10

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Validate required secrets
          env:
            API_URL: ${{ secrets.API_URL }}
            API_KEY: ${{ secrets.API_KEY }}
          run: |
            if [ -z "$API_URL" ]; then
              echo "::error::API_URL secret is missing."
              exit 1
            fi
            
            if [ -z "$API_KEY" ]; then
              echo "::error::API_KEY secret is missing."
              exit 1
            fi
            
            echo "Required secrets are configured."

        - name: Wake the API up
          env:
            API_URL: ${{ secrets.API_URL }}
          run: |
            HEALTH_URL="${API_URL%/}/health"
            
            echo "Checking API availability..."
            
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 6 \
              --retry-delay 15 \
              --retry-all-errors \
              --max-time 90 \
              "$HEALTH_URL"
            
            echo ""
            echo "API health check completed successfully."

        - name: Check every level against the live API
          working-directory: clinic-booking-api
          env:
            API_URL: ${{ secrets.API_URL }}
            API_KEY: ${{ secrets.API_KEY }}
          run: |
            python scripts/verify_live.py --yes
